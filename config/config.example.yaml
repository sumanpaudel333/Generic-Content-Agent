# Copy this file to config.yaml and fill in your own business details.
# config.yaml is gitignored -- your real business info never gets committed.

business:
  name: "Your Company Name"
  # One sentence describing what you sell and where. This gets fed directly
  # into the model's system prompt, so keep it concise and factual.
  description: "a short description of your business, e.g. a regional building supplies company with two physical locations"
  locations: ["Location A", "Location B"]
  service_regions: ["Region 1", "Region 2", "Region 3"]
  phone_display: ""   # e.g. "(02) 5555 0100" -- leave blank to omit from generated copy
  phone_tel: ""        # e.g. "+61255550100" -- digits only, used in tel: links
  heading_color: "#1e3a8a"   # hex color for section headings (Features, Applications, Delivery) in generated copy

# Some product catalogs have a category that legally or operationally needs
# a standard disclaimer attached (e.g. mixed-to-order materials with a
# shelf life, hazardous goods, perishables, custom-cut items). This section
# is OPTIONAL -- set enabled: false if your catalog has no such category.
regulated_product:
  enabled: true
  # Case-insensitive regex matched against the product title to decide
  # whether a product falls into this category.
  keyword_pattern: '\bRegulated\b'
  disclaimer_html: |
    <p><b>Important Information for Regulated Products</b><br> Some products in our
    catalog are prepared or mixed to order and have handling requirements that
    differ from standard stock items. Please confirm order details before
    delivery or pickup.</p>
    <p><b style="color:red;">This product category requires confirmation prior to
    delivery or pickup. Please contact us with any questions before ordering.</b></p>

  # Optional: if products in this category have a specific formulation/mix
  # ratio worth extracting from the title and injecting verbatim (rather
  # than letting the model restate it), set a regex here. Leave blank to
  # disable. Example pattern below matches things like "8% 12:1".
  ratio_pattern: '(\d{1,2})%\s*(\d{1,2}):(\d{1,2})'
  ratio_label: "Mixed to a ratio of"

  # Optional: a second extractable quantity detail, e.g. component counts.
  # Example pattern below matches things like "4x20kg cement".
  quantity_detail_pattern: '(\d+)\s*[x\u00d7]\s*(\d+)\s*kg\s*(?:\w+\s*)?(\w+)'

# Product IDs with a verified, real compliance/standards claim. Never let
# the model state a standard on its own -- if a product genuinely carries
# one, it belongs here and gets injected by code at assembly time.
standards_whitelist: {}
# example:
#   "1234": "AS 1234:2020 -- short description of what it certifies"

models:
  small_model_name: "content-agent"     # the Ollama model tag you `ollama create` this as
  ollama_url: "http://127.0.0.1:11434/api/chat"
  claude_model: "claude-sonnet-4-6"

# ---------------------------------------------------------------------------
# Escalation chain for content generation.
#
# The fine-tuned small model always runs first. If its output is low confidence
# (bad JSON, missing fields, an unverified compliance claim) the same task is
# retried further up the chain:
#
#   fine-tuned model  ->  fallback_model_name  ->  Claude
#
# Turn either hop off and the chain stops there. Whatever the last model
# produced still goes to the review queue marked low confidence -- switching
# these off costs quality, never a lost draft.
#
# The fallback is a general local model (free, slower than the fine-tuned one,
# no API call). Claude costs an API call per escalation and needs
# ANTHROPIC_API_KEY in .env.
# ---------------------------------------------------------------------------
escalation:
  use_fallback_model: true
  fallback_model_name: "llama3.2:3b"   # any tag `ollama list` shows
  use_claude: true

pipeline:
  daily_batch_size: 10
  daily_run_delay_seconds: 1.0
  thin_content_char_threshold: 300
  # false = always pull new products from the fallback export file, even
  # if Odoo is configured (useful while working through an initial
  # backlog import from another system). true = pull live from Odoo.
  use_odoo_as_product_source: false

# Reviewer-facing behavior in the dashboard (dashboard/app.py). Change these
# to fit how your team wants to work the queue without touching code.
approval_flow:
  auto_publish_on_approve: true   # false = approve and publish become two separate steps
  require_reject_reason: false    # true = reviewer must type a reason to reject
  page_size: 25                   # rows per page on Pending/Needs Retry/History
  min_overview_length: 15         # drafts with a shorter overview are treated as low confidence
  regenerate_temperature: 0.8     # retries use a higher temperature so they don't just
                                   # reproduce the draft that was already rejected
  regenerate_escalate_first: false # true = retries go straight to the stronger model

# Reviewer-supplied product images. The reviewer attaches photos to a draft and
# they are written to the platform in the same action as the description, so a
# product does not go live with copy and no pictures.
product_images:
  enabled: true
  max_files_per_product: 8        # how many photos one product can carry
  max_file_mb: 8                  # per file; the platform does its own downscaling
  retain_days_after_verify: 7     # keep the staged copy this long AFTER the image
                                   # has been confirmed present on the product.
                                   # 0 = reclaim as soon as it verifies

# Weekly Chatbase conversation analysis, emailed to a manager. Optional --
# set enabled: false if you have no chatbot to analyse.
# Secrets and mail server details live in .env: CHATBASE_API_KEY, SMTP_HOST,
# SMTP_PORT, SMTP_SECURITY, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, SMTP_FROM_NAME,
# SMTP_TLS_CA_FILE, SMTP_TLS_VERIFY.
# ---------------------------------------------------------------------------
# Where this dashboard is reachable. Only used to put working links into alert
# emails -- override per environment with DASHBOARD_BASE_URL in .env.
# ---------------------------------------------------------------------------
dashboard:
  base_url: ""

# ---------------------------------------------------------------------------
# Email: who receives what
#
# One list per mailing. There is no shared default and nothing falls back to
# anything else -- an EMPTY LIST means that mailing is simply not sent, which
# is how you switch one off.
#
#   Mailing         Goes out                            Typically to
#   --------------- ----------------------------------- ---------------------
#   weekly_report   Weekly, after the chat analysis     whoever reads the
#                                                        analysis
#   daily_leads     Every morning, the previous day's   sales -- it is a call
#                   leads                                list
#   lead_alerts     One per lead, the moment it is      sales, if you want
#                   found (needs alert_on_leads: true)   instant notice
#   job_failures    When a scheduled job fails          whoever looks after
#                                                        the server
#
# Override any of them from .env with a comma-separated list:
#   REPORT_RECIPIENTS  LEADS_RECIPIENTS  LEAD_ALERT_RECIPIENTS
#   JOB_FAILURE_RECIPIENTS
#
# Mail SERVER settings -- host, port, credentials, TLS -- are a separate
# concern and live in .env as SMTP_*. SMTP_RECIPIENTS is no longer read.
# ---------------------------------------------------------------------------
email:
  recipients:
    weekly_report:
      []
    daily_leads:
      []
    lead_alerts:
      []
    job_failures:
      []


chat_insights:
  enabled: false
  chatbase_agent_id: ""       # agent id -- NOT the API key. List them with:
                              #   python -m chat_insights.weekly_run --list-agents
  api_base: "https://www.chatbase.co/api/v1"   # v1 has the conversations; v2 returns empty
  lookback_days: 7
  # v1 filters by date server-side; these just bound the paging.
  page_size: 100              # v1 accepts up to 100 per page
  max_pages: 50
  request_delay_seconds: 0.2  # API allows 100 requests / 10s
  # A GENERAL model -- not a model fine-tuned for product copy. Size this to
  # your hardware: 3B suits a CPU-only host, 7-8B needs more RAM and time.
  model: "llama3.2:3b"
  temperature: 0.2
  max_analysis_tokens: 400
  min_user_messages_for_analysis: 1
  redact_email: true          # keep full transcripts locally, redact the email

  # Mail server defaults. The details actually used live in .env (SMTP_HOST,
  # SMTP_PORT, SMTP_SECURITY, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM); anything
  # set there wins over the values below, which exist only so a deployment
  # without those keys still has something to fall back on.
  # smtp_security: starttls (587) | ssl (465) | none. Blank = infer from port.
  smtp_host: ""
  smtp_port: 587
  smtp_security: ""
  smtp_from: ""
  smtp_from_name: ""      # display name, e.g. "Chatbase-Insight"
  # A relay with a self-signed certificate: point smtp_tls_ca_file at its
  # certificate (PEM) to keep verification, or set smtp_tls_verify to false to
  # encrypt without verifying. Overridden by SMTP_TLS_CA_FILE / SMTP_TLS_VERIFY.
  smtp_tls_ca_file: ""
  smtp_tls_verify: true

  # Alerts, sent through the same mail server as the weekly report.
  # A lead is emailed the moment it is detected: the CRM hand-off runs through
  # a Chatbase action into Zapier and does not always fire, so this is the
  # independent path that always does.
  alert_on_leads: true

  # --- Model-assisted lead extraction ------------------------------------
  # The rules find phone numbers and emails reliably -- they have a shape.
  # Names and the enquiry do not: "paul strachan", "but prefer" and "garden
  # stakes" are the same shape, and telling them apart needs to know what the
  # words mean. So a model gets a second pass over LEADS ONLY (a handful a
  # day, not every conversation).
  #
  # It cannot make things worse. Everything it returns is checked back against
  # the customer's own words -- a phone or email must be there digit for
  # digit, a name must be there as text -- and anything that fails is dropped,
  # leaving the rule-based result. If the model is down the lead is unchanged.
  lead_extraction:
    enabled: true
    model: local            # local | claude
    local_model: llama3.2:3b   # blank = chat_insights.model

  # --- Daily lead digest -------------------------------------------------
  # Runs every morning, independent of the weekly report. Detection is
  # deterministic (no model), so this job does not need Ollama running.
  leads_lookback_days: 3          # re-read a few days so a conversation that
                                   # spans midnight is not missed
  leads_email_when_empty: false   # false = a day with no leads sends no email
  # Our OWN phone numbers and email addresses. The bot quotes the branch
  # numbers in nearly every conversation, so without listing them here they
  # get harvested as if a customer had given them. Derived config covers
  # phone_display/phone_tel; add any other number the bot quotes.
  own_contacts:
    - "(02) 8543 3401"
    - "(02) 9939 2077"
    - "sales@bcsands.com.au"
  # Both kinds carry contact details -- a chat with no phone or email is not
  # recorded as a lead at all, since there would be nobody to follow up.
  alert_lead_types: ["form_submission", "contact_shared"]
  alert_on_job_failure: true

# ---------------------------------------------------------------------------
# Site monitor: checks the online shop every five minutes and emails when a
# page goes down, slows down or shows a problem.
#
# These are STARTING values only. Once an admin saves settings on the
# dashboard's Site health page, the saved values are used instead -- change
# them there. The pages themselves are set on that page too. The scheduled
# task BCSands-SiteMonitor runs the checks.
#
# The shop is checked two ways: "direct", through this server's own DNS,
# straight to the shop server; and "public", through Cloudflare the way
# customers reach it. The public check needs a Cloudflare rule that allows
# office_ip -- without it, Cloudflare shows its bot check to the monitor.
# ---------------------------------------------------------------------------
site_monitor:
  recipients:
    - spaudel@bcsands.com.au
  office_ip: "220.233.203.122"   # the address the Cloudflare allow rule names
  quiet_hours:
    start: "21:00"          # alerts are held from here...
    end: "06:00"            # ...until here, and summarised at:
  morning_summary_at: "06:30"
  slow_ms: 3000             # a page slower than this is "slow"
  slow_after: 3             # slow checks in a row before an alert
  down_after: 2             # failed checks in a row before an alert
  issue_after: 2            # wrong page, server error or bad certificate
  blocked_after: 3          # Cloudflare bot check
  reminder_minutes: 60      # while a page stays down
  cert_warn_days: [21, 7]
  timeout_seconds: 20
  retention_days: 90
